services:
  - type: web
    name: setup-download
    runtime: static
    buildCommand: "test -s public/downloads/setup.exe"
    staticPublishPath: ./public
    headers:
      - path: /downloads/setup.exe
        name: Content-Disposition
        value: attachment; filename="setup.exe"
      - path: /downloads/setup.exe
        name: Content-Type
        value: application/octet-stream
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
